[project]
name = "run-doctor"
version = "0.1.0"
description = "Local, deterministic summaries of Hermes delegation transcripts"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
